name: CI

on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  RUST_NIGHTLY: nightly-2025-04-02

jobs:
  build_and_test_nix:
    name: Build and test (Nix)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
        rust:
          - nightly-2025-04-02
          - stable

    steps:
    - name: Checkout
      uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      with:
        submodules: recursive

    - name: Checkout submodules
      run: git submodule update --checkout

    - name: Install ${{ matrix.rust }}
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
        toolchain: ${{ matrix.rust }}
        override: true

    - name: Install cargo-nextest
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: nextest@0.9.80

    - name: tests
      run: cargo nextest run --lib --bins --tests --all

    - name: doc tests
      run: cargo test --doc

    - name: asm
      if: ${{ matrix.rust == env.RUST_NIGHTLY }}
      run: cargo nextest run --lib --bins --tests --all --features asm

    - name: malformed-artifact-compat
      if: ${{ matrix.rust == env.RUST_NIGHTLY }}
      run: cargo nextest run --lib --bins --tests --all --features malformed-artifact-compat

    - name: pqc
      if: ${{ matrix.rust == env.RUST_NIGHTLY }}
      run: cargo nextest run --lib --bins --tests --all --features draft-pqc

    - name: forwarding
      if: ${{ matrix.rust == env.RUST_NIGHTLY }}
      run: cargo nextest run --lib --bins --tests --all --features draft-wussler-openpgp-forwarding

    - name: all-features
      if: ${{ matrix.rust == env.RUST_NIGHTLY }}
      run: cargo nextest run --lib --bins --tests --all --all-features

    - name: tests ignored
      run: cargo nextest run --lib --bins --tests --all --run-ignored ignored-only --release

    - name: asm ignored
      run: cargo nextest run --lib --bins --tests --all --run-ignored ignored-only --release --features asm

    - name: pqc ignored
      run: cargo nextest run --lib --bins --tests --all --run-ignored ignored-only --release --features draft-pqc

  build_and_test_windows:
    name: Build and test (Windows)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        rust:
          - stable-x86_64-pc-windows-msvc
          - stable-x86_64-pc-windows-gnu

    steps:
    - name: Checkout
      uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      with:
        submodules: recursive

    - name: Checkout submodules
      run: git submodule update --checkout

    - name: Install ${{ matrix.rust }}
      run: rustup default ${{ matrix.rust }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      with:
        tool: nextest@0.9.80

    - name: tests
      run: cargo nextest run --lib --bins --tests --all

    - name: tests - pqc
      run: cargo nextest run --lib --bins --tests --all --features draft-pqc

    - name: tests ignored
      run: cargo nextest run --lib --bins --tests --all --run-ignored ignored-only --release

    - name: tests ignored - pqc
      run: cargo nextest run --lib --bins --tests --all --run-ignored ignored-only --release --features draft-pqc

  cross:
    name: Cross compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - i686-unknown-linux-gnu
          - powerpc-unknown-linux-gnu
          - arm-linux-androideabi

    steps:
    - name: Checkout
      uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      with:
        submodules: recursive

    - name: Checkout submodules
      run: git submodule update --checkout

    - name: Install stable
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
        toolchain: 1.88
        target: ${{ matrix.target }}
        override: true

    - name: Install cross
      run: cargo install cross

    - name: test
      run: cross test --release --all --target ${{ matrix.target }}

    - name: test - pqc
      run: cross test --release --all --target ${{ matrix.target }} --features draft-pqc

  check_wasm:
    name: Check wasm targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - nightly-2025-04-02
          - stable

    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

    - name: Install rust with wasm32-unknown-unknown
      uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
        toolchain: ${{ matrix.rust }}
        target: wasm32-unknown-unknown
        override: true

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cargo/registry
        key: wasm32-${{ matrix.rust }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}

    - name: check
      uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1.0.3
      with:
        command: check
        args: --target wasm32-unknown-unknown --no-default-features --features wasm

    - name: check - pqc
      uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1.0.3
      with:
        command: check
        args: --target wasm32-unknown-unknown --no-default-features --features wasm,draft-pqc

  check_fmt:
    name: Checking fmt
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt
      - uses: mozilla-actions/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7
      - uses: taiki-e/install-action@a585bdc62a98654f59f7ad33418bc58c37517930 # cargo-make
      - run: cargo make format-check

  check_docs:
    name: Checking docs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master

    - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
          profile: minimal
          toolchain: ${{ env.RUST_NIGHTLY }}
          override: true
          components: rustfmt

    - name: Docs
      run: cargo doc --all-features

  clippy_check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
          profile: minimal
          toolchain: ${{ env.RUST_NIGHTLY }}
          override: true
          components: clippy
    - uses: actions-rs/clippy-check@b5b5f21f4797c02da247df37026fcd0a5024aa4d # v1.0.7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        args: --all-features --all-targets --tests --bins --examples --benches

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - uses: codespell-project/actions-codespell@02dddb342731ef97c88b2c2f7e0703bb49610f36 # master

  cargo_deny:
    timeout-minutes: 30
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --workspace --all-features
          command: check
          command-arguments: "-Dwarnings"

  minimal_versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      - name: Install toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          profile: minimal
          toolchain: ${{ env.RUST_NIGHTLY }}
          override: true
      - name: check minimal version
        run: rm Cargo.lock && cargo check -Z direct-minimal-versions --all
